{% set pyproject = load_file_data("pyproject.toml") %}
{% set version = pyproject["project"]["version"] %}

package:
  name: fedoo
  version: {{ version }}

source:
  git_url: https://github.com/3MAH/fedoo.git
  
build:
  noarch: python
  script: pip install .
  
requirements:
  host:
    - python
    - pip
  run:
    - python>=3.10
    - numpy>=2
    - scipy
    - h5py
    - pyvista>=0.42
    - simcoon>=2.0.0b1
    # python-mumps works on every platform (unlike pypardiso, Intel-only),
    # which keeps the package noarch. The runtime solver selection prefers
    # pypardiso when the user installs it on top (Intel machines).
    - python-mumps

test:
  imports:
    - fedoo
  source_files:
    - tests
  requires:
    - pytest
  commands:
    - pytest tests
