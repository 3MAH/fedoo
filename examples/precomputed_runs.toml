# Examples that are too heavy to run at each documentation build.
#
# The documentation build (docs/conf.py) does not execute the examples listed
# here: their page shows the code and a precomputed animation, with the
# software versions and the date of the run recorded below.
#
# The animations are hosted in the 3MAH/fedoo-docs repository, under
# ``media_root``. Regenerate them with ``python tools/run_precomputed.py``,
# which runs the listed examples headless, writes the animations in
# ``docs/build/precomputed_media/`` and updates the run record of each entry;
# then copy that folder to ``media/examples/`` in 3MAH/fedoo-docs. Run all the
# examples with the same fedoo version when preparing a release, so that the
# recorded versions match.
#
# Entry fields
# ------------
# path       example script, relative to ``examples/``
# media      animation file name, relative to ``media_root`` (mp4 or gif)
# movie      optional table: how to build the animation from a result file,
#            e.g. {result = "results/tube_compression", field = "P"}; other
#            keys are passed to MultiFrameDataSet.write_movie. Without it, the
#            example must write a file named like ``media`` in its folder or
#            in its ``results`` subfolder.
# run        run record written by tools/run_precomputed.py; empty until the
#            example has been run: fedoo version and commit, simcoon, ipctk
#            and numpy versions, date, machine, wall time in seconds

media_root = "https://3mah.github.io/fedoo-docs/media/examples"

[[example]]
path = "contact/tube_compression.py"
media = "contact/tube_compression.gif"
run = {}

[[example]]
path = "contact/ipc_tube_compression.py"
media = "contact/ipc_tube_compression.gif"
movie = {result = "results/tube_compression_ipc", field = "P", data_type = "Node", framerate = 10}
run = {}

