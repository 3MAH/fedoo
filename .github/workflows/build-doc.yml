name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]

env:
  USE_CACHE: "false"

# All documentation channels are stored on the same branch of fedoo-docs.
# Serialize deployments so concurrent builds cannot overwrite each other's push.
concurrency:
  group: fedoo-documentation-publish
  cancel-in-progress: false

jobs:
  build-doc:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
      - uses: actions/checkout@v6

      - name: Select documentation channel
        id: documentation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            state="dev"
            destination="dev_pr"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
              state="beta"
              destination="beta"
            else
              state="stable"
              destination="stable"
            fi
          else
            state="dev"
            destination="dev"
          fi

          echo "FEDOO_DOC_STATE=$state" >> "$GITHUB_ENV"
          echo "destination_dir=$destination" >> "$GITHUB_OUTPUT"
          echo "Documentation state: $state"
          echo "Deployment directory: $destination"

      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          activate-environment: fedoo-doc

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache Conda env
        uses: actions/cache@v5
        with:
          path: ${{ env.CONDA }}/envs
          key: conda-${{ runner.os }}--${{ runner.arch }}--${{ steps.get-date.outputs.today }}-${{ hashFiles('environment_doc.yml') }}-${{ env.CACHE_NUMBER }}
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        id: cache

      - name: Update environment
        run: |
          conda env update -n fedoo-doc -f environment_doc.yml
          # microgen needs cadquery/gmsh which we don't want pulled in;
          # the docs only use microgen.box_mesh.BoxMesh which has no such deps.
          pip install --no-deps microgen
          # swap default vtk for vtk-osmesa (avoid PyVista openGL errors)
          # https://github.com/pyvista/pyvista/blob/main/.github/workflows/vtk-pre-test.yml#L53
          # - pip uninstall -y vtk
          conda remove --force vtk
          pip install --extra-index-url https://wheels.vtk.org trame vtk-osmesa
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Conda info
        run: |
          conda info
          conda list

      - name: Cache Sphinx-Gallery Examples
        uses: actions/cache@v5
        if: env.USE_CACHE == 'true'
        with:
          path: examples/
          key: doc-examples-${{ hashFiles('fedoo/_version.py') }}

      - name: Cache Sphinx build directory
        uses: actions/cache@v5
        if: env.USE_CACHE == 'true'
        with:
          path: docs/build/
          key: doc-build-${{ hashFiles('fedoo/_version.py') }}

      - name: Build Documentation
        run: make -C docs clean html

      - name: Upload HTML documentation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docs-build
          path:
            docs/build/html/

      - name: Deploy HTML documentation
        # Fork pull requests do not have access to FEDOO_DOC_TOKEN. Their
        # documentation remains available through the artifact uploaded above.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.FEDOO_DOC_TOKEN }}
          external_repository: 3MAH/fedoo-docs
          publish_branch: main
          publish_dir: ./docs/build/html
          destination_dir: ${{ steps.documentation.outputs.destination_dir }}
